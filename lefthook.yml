pre-commit:
  commands:
    check:
      run: /bin/zsh -l -c "pnpm format {staged_files}"
      glob: '*.{js,jsx,.mjs,ts,tsx,css,json,md}'
      stage_fixed: true

pre-push:
  commands:
    validate:
      glob: '*.{ts,tsx}'
      run: /bin/zsh -l -c "pnpm typecheck"
    lint:
      glob: '*.{ts,tsx}'
      run: /bin/zsh -l -c "pnpm lint"
    test:
      glob: '*.{ts,tsx}'
      run: /bin/zsh -l -c "pnpm test:coverage"
